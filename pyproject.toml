[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beancount-main"
version = "0.0.0"
description = "Local Beancount ledger with custom plugins and importers"
requires-python = ">=3.11"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["importers*", "plugins*"]
